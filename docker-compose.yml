services:
  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    environment:
      DATABASE_PATH: /app/data/prototype.db
      APP_MODE: demo
    volumes: ["prototype-data:/app/data"]
  ui:
    build: .
    command: streamlit run app/ui.py --server.address 0.0.0.0 --server.port 8501
    ports: ["127.0.0.1:${UI_PORT:-8501}:8501"]
    environment:
      API_BASE_URL: http://api:8000
    depends_on: [api]
volumes:
  prototype-data:
